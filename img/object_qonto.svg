<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .qonto-bg { fill: #111111; }
    .qonto-fg { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .qonto-bg { fill: #EEEEEE; }
      .qonto-fg { fill: #111111; }
    }
  </style>
  <rect width="100" height="100" rx="22" class="qonto-bg" />
  
  <g class="qonto-fg">
    <defs>
      <path id="qonto-petal" d="M 50 47.5 C 43.5 39, 43.5 23, 50 14.5 C 56.5 23, 56.5 39, 50 47.5 Z" />
    </defs>
    <use href="#qonto-petal" transform="rotate(45 50 50)" />
    <use href="#qonto-petal" transform="rotate(135 50 50)" />
    <use href="#qonto-petal" transform="rotate(225 50 50)" />
    <use href="#qonto-petal" transform="rotate(315 50 50)" />
  </g>
</svg>